name: CI

on: 
  pull_request: 
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm 

      - run: npm ci
      - run: npx prisma generate

      - run: npm run lint:check
      - run: npm test
      - run: npm run build 